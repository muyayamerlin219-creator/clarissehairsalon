<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manager Login - Clarisse Hair Salon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#333333", // Deep charcoal
                        "secondary": "#D4AF37", // Soft gold
                        "background-light": "#f5f3f0", // Off-white/light cream
                        "background-dark": "#1a1a1a",
                        "accent": "#984b43" // Terracotta/deep burgundy
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<header class="absolute top-0 left-0 w-full p-6">
<div class="flex items-center justify-start">
<!-- You can replace this with your actual logo -->
<span class="text-2xl font-bold text-gray-900 dark:text-white">Clarisse</span>
</div>
</header>
<div class="layout-container flex h-full grow flex-col justify-center w-full max-w-md px-4">
<div class="layout-content-container flex flex-col items-center gap-8 py-10">
<div class="text-center w-full">
<p class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Welcome Back</p>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Administrator Login</p>
</div>
<div class="flex flex-col gap-6 w-full">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email" type="email" value=""/>
</label>
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<button class="text-gray-500 dark:text-gray-400 flex border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center px-4 rounded-r-lg border-l-0 hover:text-primary dark:hover:text-secondary focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-[0.015em] transition-colors duration-200">
<span class="truncate">Login</span>
</button>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal text-center underline hover:text-accent dark:hover:text-secondary cursor-pointer">Forgot your password?</p>
</div>
</div>
</div>
<footer class="absolute bottom-0 w-full p-6 text-center">
<p class="text-gray-500 dark:text-gray-400 text-xs">© 2024 Clarisse Hair Salon. All Rights Reserved. | <a class="underline hover:text-accent dark:hover:text-secondary" href="#">Back to Main Site</a></p>
</footer>
</div>
</body></html>
